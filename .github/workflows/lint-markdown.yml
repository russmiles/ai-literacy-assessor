# Enforces consistent markdown formatting across the repository.
# Runs on every push and pull request that modifies markdown files.
name: Lint Markdown

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.md"
