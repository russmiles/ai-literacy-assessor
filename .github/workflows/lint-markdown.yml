# Enforces consistent markdown formatting across the repository.
# Runs on every push and pull request that modifies markdown files.
name: Lint Markdown

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.md"
